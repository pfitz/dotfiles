"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](surface0)\
$os\
$username\
[](bg:orange fg:surface0)\
$directory\
[](fg:orange bg:pink)\
${custom.git_info}\
${custom.jj}\
[](fg:pink bg:flamingo)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$elixir\
[](fg:flamingo bg:rosewater)\
$docker_context\
$time\
[](fg:rosewater)\
$line_break$character"""

palette = 'catppuccin_mocha'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
orange = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[os]
disabled = false
style = "bg:surface0 fg:text"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = ""
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󴄛"
RedHatEnterprise = "󴄛"

[username]
show_always = true
style_user = "bg:surface0 fg:text"
style_root = "bg:surface0 fg:text"
format = '[ $user ]($style)'

[directory]
style = "fg:mantle bg:orange"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲫 "

[git_branch]
disabled = true
symbol = ""
style = "bg:pink"
format = '[[ $symbol $branch ](fg:base bg:pink)]($style)'
disabled_when = "jj root 2>/dev/null"

[git_status]
disabled = true
style = "bg:pink"
format = '[[($all_status$ahead_behind )](fg:base bg:pink)]($style)'
disabled_when = "jj root 2>/dev/null"

[nodejs]
symbol = ""
style = "bg:flamingo"
format = '[[ $symbol( $version) ](fg:base bg:flamingo)]($style)'

[c]
symbol = " "
style = "bg:flamingo"
format = '[[ $symbol( $version) ](fg:base bg:flamingo)]($style)'

[rust]
symbol = ""
style = "bg:flamingo"
format = '[[ $symbol( $version) ](fg:base bg:flamingo)]($style)'

[golang]
symbol = ""
style = "bg:flamingo"
format = '[[ $symbol( $version) ](fg:base bg:flamingo)]($style)'

[php]
symbol = ""
style = "bg:flamingo"
format = '[[ $symbol( $version) ](fg:base bg:flamingo)]($style)'

[java]
symbol = " "
style = "bg:flamingo"
format = '[[ $symbol( $version) ](fg:base bg:flamingo)]($style)'

[kotlin]
symbol = ""
style = "bg:flamingo"
format = '[[ $symbol( $version) ](fg:base bg:flamingo)]($style)'

[haskell]
symbol = ""
style = "bg:flamingo"
format = '[[ $symbol( $version) ](fg:base bg:flamingo)]($style)'

[python]
symbol = ""
style = "bg:flamingo"
format = '[[ $symbol( $version) ](fg:base bg:flamingo)]($style)'

[elixir]
symbol = ""
style = "bg:flamingo"
format = '[[ $symbol ](fg:base bg:flamingo)]($style)'

[docker_context]
symbol = ""
style = "bg:rosewater"
format = '[[ $symbol( $context) ](fg:base bg:rosewater)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:rosewater"
format = '[[  $time ](fg:mantle bg:rosewater)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:green)'
error_symbol = '[](bold fg:red)'
vimcmd_symbol = '[](bold fg:creen)'
vimcmd_replace_one_symbol = '[](bold fg:purple)'
vimcmd_replace_symbol = '[](bold fg:purple)'
vimcmd_visual_symbol = '[](bold fg:lavender)'

[custom.jj]
command = "jj log -r @ --no-graph -T 'change_id.shortest() ++ if(empty, \"\", \" *\") ++ if(conflict, \" \u2717\", \"\")'  2>/dev/null"
detect_folders = [".jj"]
when = "jj root 2>/dev/null"
symbol = "󰊢 "
style = "bg:pink"
format = '[[ $symbol$output ](fg:base bg:pink)]($style)'

[custom.git_info]
command = 'branch=$(git branch --show-current 2>/dev/null || git rev-parse --short HEAD 2>/dev/null); dirty=$(git diff --quiet 2>/dev/null || echo " *"); ahead=$(git rev-list @{u}.. 2>/dev/null | wc -l | tr -d " "); behind=$(git rev-list ..@{u} 2>/dev/null | wc -l | tr -d " "); extra=""; [ "$ahead" -gt 0 ] 2>/dev/null && extra="${extra}⇡${ahead}"; [ "$behind" -gt 0 ] 2>/dev/null && extra="${extra}⇣${behind}"; echo "$branch$dirty${extra:+ $extra}"'
when = "git rev-parse --is-inside-work-tree 2>/dev/null && ! jj root 2>/dev/null"
symbol = " "
style = "bg:pink"
format = '[[ $symbol$output ](fg:base bg:pink)]($style)'
