##### Paths / environment #####

# Explicit PATH for tmux (optional, keep if you need it)
set-environment -g PATH "/Users/Friedrich.Pfitzmann/homebrew/bin:/usr/local/bin:/bin:/usr/bin"

# Directory for tmux-related data (used by resurrect)
set-environment -g TMUX_DIR "~/.config/tmux"


##### Terminal & colors #####

# Modern TERM inside tmux
set -g default-terminal "tmux-256color"

# Enable truecolor for 256-color terminals
set -ga terminal-overrides ",*256col*:Tc"
set-environment -g COLORTERM "truecolor"


##### Prefix & reload #####

# Use Ctrl-e as prefix
unbind C-b
set -g prefix C-e

# Reload config with prefix + r
unbind r
bind r source-file "~/.config/tmux/tmux.conf" \; display-message "tmux config reloaded"

# Command prompt with prefix + Enter
bind Enter command-prompt


##### Basic behavior #####

# Mouse support (resize/select/scroll)
set -g mouse on

# Vi-style keys in copy/scrollback mode
set-window-option -g mode-keys vi
#
# Start windows and panes at 1, keep numbering compact
set -g base-index 1
set -g renumber-windows on
set -g pane-base-index 1
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set-window-option -g pane-base-index 1

# Larger scrollback
set -g history-limit 10000

# Do not auto-rename windows to running command
set -g allow-rename off


##### Splits & panes #####

# Split bindings: prefix + h (horizontal) / prefix + v (vertical)
bind h split-window -h
bind v split-window -v

# Toggle synchronize panes (prefix + e / E)
bind e setw synchronize-panes on  \; display-message "synchronize-panes ON"
bind E setw synchronize-panes off \; display-message "synchronize-panes OFF"

## Fast pane selection (your existing binding)
unbind ^s
bind ^s select-pane -t :.+

# New session (prefix + Shift+N) — used by ZMK tmux layer
bind N new-session

# vim-tmux-navigator: seamless C-h/j/k/l across vim splits and tmux panes
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Pane resizing with prefix + Shift+H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

##### Custom helpers #####

# Cheat sheet and sessionizer scripts
bind-key -r a run-shell "tmux neww '~/dotfiles/bin/tmux-cht.sh'"
bind-key -r f run-shell "tmux neww '~/dotfiles/bin/tmux-sessionizer.sh'"


##### Status bar basics #####

# Update interval and layout (Catppuccin will style this)
set -g status-interval 5
set -g status-justify left
set -g status-position top


set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-custom-paths '/Users/omerxx/dotfiles'
set -g @sessionx-bind 'o'
set -g @sessionx-x-path '~/dotfiles'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'

##### Plugins (TPM) #####

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

##### Catppuccin configuration #####
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W ●"
set -g @catppuccin_date_time_text "%Y-%m-%d %H:%M"

##### Resurrect / Continuum configuration #####
set -g @resurrect-dir "#{env:TMUX_DIR}/resurrect"
set -g @resurrect-save "S"
set -g @resurrect-restore "R"
set -g @continuum-restore "on"
set -g @resurrect-strategy-nvim "session"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# Status bar (configured after TPM/catppuccin has loaded)
set -g status-left ""
set -g status-right ""
set -g status-right-length 100
set -g status-left-length 100
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
